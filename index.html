<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaAz.app | Advanced Security - Coming Soon</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        :root {
            --maaz-red: #da291c;
            --maaz-gray-light: #53565a;
            --maaz-gray-dark: #2a2c2e;
            --bg-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Prevent text selection across the page */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--maaz-gray-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            padding: 20px;
            transition: filter 0.3s ease;
        }

        /* Privacy Layer for Screen Recording / Blur on Unfocus */
        body.protected {
            filter: blur(25px) grayscale(100%);
            opacity: 0.1;
            pointer-events: none;
        }

        .coming-soon-container {
            max-width: 600px;
            width: 100%;
        }

        .logo-section {
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }

        .main-logo {
            max-width: 300px;
            width: 100%;
            height: auto;
            pointer-events: none; /* Prevents dragging image */
        }

        .status-header {
            margin-bottom: 25px;
            animation: fadeIn 1.2s ease-out 0.5s both;
        }

        .pre-title {
            display: inline-block;
            color: var(--maaz-red);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            padding: 6px 16px;
            background-color: rgba(218, 41, 28, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(218, 41, 28, 0.2);
        }

        /* Main Headline with Redacted Blur effect */
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--maaz-gray-dark);
            line-height: 1.2;
        }

        /* Hover-to-Reveal / Redact Effect */
        .secure-text {
            display: inline-block;
            position: relative;
            filter: blur(10px);
            background: #2a2c2e;
            color: transparent;
            border-radius: 4px;
            padding: 0 8px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .secure-text::after {
            content: "🔒 HOVER TO DECRYPT";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: var(--maaz-red);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        /* Revealed State on Hover */
        .secure-text:hover {
            filter: blur(0);
            background: transparent;
            color: var(--maaz-gray-dark);
        }

        .secure-text:hover::after {
            opacity: 0;
        }

        /* Description with Hover Reveal */
        p.description {
            font-size: 1.1rem;
            color: var(--maaz-gray-light);
            margin-top: 25px;
            margin-bottom: 40px;
            line-height: 1.6;
            animation: fadeIn 1.2s ease-out 0.8s both;
        }

        .privacy-notice {
            font-size: 0.8rem;
            color: var(--maaz-red);
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .footer-tagline {
            color: var(--maaz-gray-light);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            animation: fadeInUp 1s ease-out 1.2s both;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }

        .tag-dot {
            color: var(--maaz-red);
            font-size: 0.7rem;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p.description { font-size: 0.95rem; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="coming-soon-container">
        
        <!-- Logo -->
        <div class="logo-section">
            <img src="logo.jpeg" alt="MaAz Security Logo" class="main-logo" ondragstart="return false;">
        </div>

        <!-- Headline with Interactive Decryption -->
        <div class="status-header">
            <span class="pre-title">ENCRYPTED ENVIRONMENT</span>
            <h1>
                Next-Gen Security<br>
                <span class="secure-text">Is Launching Soon</span>
            </h1>
        </div>

        <!-- Description with Hover Reveal -->
        <p class="description">
            We are engineering a zero-trust platform. <br>
            <span class="secure-text">Protected from recording, leaks, and unauthorized access.</span>
        </p>

        <div class="privacy-notice">
            🛡️ Content Protection Active
        </div>

        <!-- Taglines -->
        <div class="footer-tagline">
            <span>Secure</span>
            <span class="tag-dot">•</span>
            <span>Trusted</span>
            <span class="tag-dot">•</span>
            <span>Controlled</span>
        </div>

    </div>

    <script>
        // --- ANTI-SCREENSHOT & SCREEN RECORDING PROTECTION ---

        // 1. Obscure page when window loses focus (Tab switch, Snipping Tool, or Screen Recorders)
        window.addEventListener('blur', () => {
            document.body.classList.add('protected');
        });

        window.addEventListener('focus', () => {
            document.body.classList.remove('protected');
        });

        // 2. Disable Key Shortcuts (PrtScn, Ctrl+P, Ctrl+S, Inspect Element)
        document.addEventListener('keyup', (e) => {
            if (e.key === 'PrintScreen') {
                navigator.clipboard.writeText(''); // Clear clipboard
                alert('Screenshots are disabled on MaAz.app for security reasons.');
            }
        });

        document.addEventListener('keydown', (e) => {
            // Block Ctrl+P (Print), Ctrl+S (Save), Ctrl+Shift+I (DevTools)
            if (
                (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u')) ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                (e.metaKey && e.shiftKey && (e.key === '3' || e.key === '4' || e.key === '5')) // macOS Screenshots
            ) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
